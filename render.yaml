services:
  - type: web
    name: frs-password-mailer
    runtime: node
    rootDir: render-mailer
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MAILER_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SITE_ORIGIN
        sync: false
